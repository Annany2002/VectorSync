syntax = "proto3";

package document;

option go_package = "github.com/Annany2002/vector-sync/api/proto/v1/generated";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
// importing annotations for grpc-gateway
import "google/api/annotations.proto";

// Document represents a document in a collection
message Document {
    // unique id of the document
    string id = 1;
    // creation timestamp
    google.protobuf.Timestamp created_at = 2;
    // update timestamp
    google.protobuf.Timestamp updated_at = 3;
    // id of the collection the document belongs to
    string collection_id = 4;
    // content of the document
    string content = 5;
    // vector representation of the document
    repeated float vector = 6;
    // metadata associated with the document
    map<string, google.protobuf.Struct> metadata = 7;
}

// CreateDocumentRequest represents a request to create a document
message CreateDocumentRequest {
    // id of the collection the document belongs to
    string collection_id = 1;
    // content of the document
    string content = 2;
    // vector representation of the document
    repeated float vector = 3;
    // metadata associated with the document
    map<string, google.protobuf.Struct> metadata = 4;
}

// CreateDocumentResponse represents a response to create a document
message CreateDocumentResponse {
    // id of the created document
    string id = 1;
    // creation timestamp
    google.protobuf.Timestamp created_at = 2;
    // update timestamp
    google.protobuf.Timestamp updated_at = 3;
}

// ListDocumentRequest represents a request to list a single document
message ListDocumentRequest {
    // id of the document to list
    string id = 1;
}

// ListDocumentResponse represents a response to list a single document
message ListDocumentResponse {
    // retrieved document
    Document document = 1;
}

// ListDocumentsRequest represents a request to list documents
message ListDocumentsRequest {
    // id of the collection to list documents from
    string collection_id = 1;
    // number of documents to return
    int32 limit = 2;
    // offset for pagination
    int32 offset = 3;
    // include vector in response (omit for smaller response size, default: true for backward compatibility)
    bool include_vector = 4;
}

// ListDocumentsResponse represents a response to list documents
message ListDocumentsResponse {
    // list of documents
    repeated Document documents = 1;
}

// DeleteDocumentRequest represents a request to delete a document
message DeleteDocumentRequest {
    // id of the document to delete
    string id = 1;
}

// DeleteDocumentResponse represents a response to delete a document
message DeleteDocumentResponse {
    // id of the deleted document
    string id = 1;
    // timestamp of the deletion
    google.protobuf.Timestamp deleted_at = 2;
}

// SearchDocumentRequest represents a request to search a similar vector within a collection
message SearchDocumentRequest {
    // collection_id of the collection to search
    string collection_id = 1;
    // search vector
    repeated float query_vector = 2;
    // the number of returned results (top-k nearest neighbours)
    int32 top_k = 3;
    // optional metadata filters (JSONB filtering)
    map<string, google.protobuf.Struct> metadata_filter = 4;
    // include vector in response or not (omit for smaller response size)
    bool include_vector = 5;
    // minimum similarity threshold (0.0 - 1.0, 0 means no threshold)
    float min_threshold = 6;
}

// SearchResult represents a single search result with similarity score
message SearchResult {
    // the matching document
    Document document = 1;
    // the similarity score(0.0 - 1.0, the higher is more similar)
    float score = 2;
}

// SearchDocumentResponse represents a response to a similarity search request
message SearchDocumentResponse {
    // search results ordered by similarity (highest first)
    repeated SearchResult results = 1;
}

// UpsertDocumentRequest represents a request to insert or update a document
message UpsertDocumentRequest {
    // id of the document (required for upsert - used as conflict key)
    string id = 1;
    // id of the collection the document belongs to
    string collection_id = 2;
    // content of the document
    string content = 3;
    // vector representation of the document
    repeated float vector = 4;
    // metadata associated with the document
    map<string, google.protobuf.Struct> metadata = 5;
}

// UpsertDocumentResponse represents a response to upsert a document
message UpsertDocumentResponse {
    // id of the upserted document
    string id = 1;
    // true if document was created, false if updated
    bool is_new = 2;
    // creation timestamp
    google.protobuf.Timestamp created_at = 3;
    // update timestamp
    google.protobuf.Timestamp updated_at = 4;
}

// FullTextSearchRequest represent a request for performing `full text search` on a collection
message FullTextSearchRequest {
    // id of the collection to search within
    string collection_id = 1;

    // Search query text (supports multiple words)
    string query = 2;

    // Maximum number of results to return
    int32 limit = 3;

    // Minimum relevance rank threshold (0.0 to 1.0, 0 means no threshold)
    float min_rank = 4;
}

// FullTextSearchResponse represent a response for `full text search` for a document
message FullTextSearchResponse {
    repeated SearchResult result = 1;
}

// BatchInsertDocumentRequest represents a batch insert of documents in a collection
message BatchInsertDocumentRequest {
    // the collection_id
    string collection_id = 1;

    // array of documents
    repeated CreateDocumentRequest documents = 2;
}

// BatchInsertDocumentResponse represents a response of batch insert of documents and count of documents inserted
message BatchInsertDocumentResponse {
    // the total number of successful insertions
    int32 insert_count = 1;

    // ids of the inserted documents
    repeated string document_ids = 2;
}

// BatchDeleteDocumentRequest represents a batch deletion of documents in a collection
message BatchDeleteDocumentRequest {
    // the collection_id
    string collection_id = 1;

    // array of document ids
    repeated string documentIds = 2;
}

// BatchDeleteDocumentResponse represents a response of batch delete of documents and count of documents deleted
message BatchDeleteDocumentResponse {
    // the total number of deletions
    int32 deleted_count = 1;

    // ids of the deleted documents
    repeated string document_ids = 2;
}

// HybridSearchRequest represents a request for performing hybrid search on collection
message HybridSearchRequest{
    // the colletion_id
    string collection_id = 1;
    // the query vector for vector search
    repeated float query_vector = 2;
    // the query required for full text search
    string query_text = 3;
    // the number of returned results
    int32 top_k = 4;
    // the optional metadata required for metadata filtering
    map<string, google.protobuf.Struct> metadata = 5;
    // Weight for vector score (0.0-1.0)
    float vector_weight = 6; 
    // Weight for text score (0.0-1.0)
    float text_weight = 7;
    bool include_vector = 8;
}

// HybridSearchResponse represents a response for hybrid search on collection
message HybridSearchResponse{
    repeated SearchResult results = 1;
}

// DocumentService provides document management operations
service DocumentService {
    rpc CreateDocument (CreateDocumentRequest) returns (CreateDocumentResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents"
            body : "*"
        };
    };
    rpc UpsertDocument (UpsertDocumentRequest) returns (UpsertDocumentResponse) {
        option (google.api.http) = {
            put: "/api/v1/documents/{id}"
            body: "*"
        };
    };
    rpc ListDocument (ListDocumentRequest) returns (ListDocumentResponse) {
        option (google.api.http) = {
            get: "/api/v1/documents/{id}"
        };
    };
    rpc ListDocuments (ListDocumentsRequest) returns (ListDocumentsResponse) {
        option (google.api.http) = {
            get: "/api/v1/documents" // due to path conflict with ListDocument, the collection_id will be in query params
        };
    };
    rpc DeleteDocument (DeleteDocumentRequest) returns (DeleteDocumentResponse) {
        option (google.api.http) = {
            delete: "/api/v1/documents/{id}"
        };
    };
    rpc SearchDocuments (SearchDocumentRequest) returns (SearchDocumentResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents/search"
            body: "*"
        };
    };
    rpc FullTextSearch (FullTextSearchRequest) returns (FullTextSearchResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents/text-search"
            body: "*"
        };
    };
    rpc BatchInsert (BatchInsertDocumentRequest) returns (BatchInsertDocumentResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents/batch"
            body: "*"
        };
    };
    rpc BatchDelete (BatchDeleteDocumentRequest) returns (BatchDeleteDocumentResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents/batch-delete"
            body: "*"
        };
    };
    rpc HybridSearch (HybridSearchRequest) returns (HybridSearchResponse) {
        option (google.api.http) = {
            post: "/api/v1/documents/hybrid-search"
            body: "*"
        };
    };
}