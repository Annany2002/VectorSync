syntax = "proto3";

package common;

option go_package = "github.com/Annany2002/vector-sync/api/proto/v1";

import "google/protobuf/timestamp.proto";

// Common represents fields that are common to multiple entities
message Common {
    // unique id of the object
    string id = 1;

    // creation and update timestamps
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Timestamp updated_at = 3;
}