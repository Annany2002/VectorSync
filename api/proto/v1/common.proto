syntax = "proto3";

package common;

option go_package = "github.com/Annany2002/vector-sync/internal/pb";

import "google/protobuf/timestamp.proto";

// Common represents fields that are common to multiple messages
message Common {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Timestamp updated_at = 3;
}